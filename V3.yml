---
# PRESENTATION: Stage 01 Discovery, Stage 02 Deployment, final execution status.
# Reports use aligned text lines and status tags [PASS]/[SKIP]/[WARN]/[FAIL]
# because ANSI color codes are not consistently rendered by AAP stdout.
# Core deployment, backup and rollback behavior is retained.
#
# CISCO CATALYST 9300 / IOS XE 17.5.6 / ANSIBLE AUTOMATION PLATFORM 2.5
# ONE FILE — No Vlan_Data, data_vlan_min or data_vlan_max required.
# Discovers ALL active VLAN IDs and NAMES from live switch config, then selects
# business Data VLANs by their NAME (DATA/USER/CLIENT/etc.). If VLANs have
# ambiguous names, set approved_data_vlans to the approved IDs; otherwise the
# playbook FAILS CLOSED and will not configure those VLANs.
# Explicit approved_data_vlans takes PRECEDENCE over name matching.
#
# SAFE FIRST RUN: run_mode=discover (READ ONLY, no backup or config changes).
# Deployment requires explicit approval. Scope is approved_only by default.
# Point the AAP Job Template/Limit at ONLY authorized Cisco C9300 stacks.
# Use AAP Network credentials for SSH/enable: NO passwords in this YAML.
# Requires cisco.ios and ansible.netcommon in the Execution Environment.
#
# Recovery: on detected errors, attempt 'configure replace' from flash over SSH.
# NOT a guaranteed recovery if management SSH goes down. Test out-of-band
# access and a device-side fail-safe separately before production deployment.
#
- name: Dynamically discover named Data VLANs and optionally deploy dot1x MAB
  hosts: all
  gather_facts: false
  connection: ansible.netcommon.network_cli
  become: true
  become_method: enable
  serial: 1

  vars:
    ansible_network_os: cisco.ios.ios
    ansible_command_timeout: 180

    # AAP extra vars may override all controls below.
    run_mode: discover                  # discover | deploy
    deployment_approved: false         # MUST be true to modify configuration
    deploy_scope: approved_only        # approved_only | all_discovered
    approved_interfaces: []            # e.g. ['Gi1/0/10'] from discovery report
    excluded_interfaces: []            # exact names as in discovery output
    max_ports_per_run: 1               # deliberate change-size limit per stack
    allow_voice_vlan_ports: false      # explicit pilot required for phones
    require_authorized_session: false  # enable only with a connected test host

    # No numeric minimum/maximum: read current active VLANs automatically.
    # VLAN numbering alone cannot reliably identify a business Data VLAN.
    # Use a conservative NAME pattern; adjust to local naming conventions.
    # Regex is case-insensitive and matches tokens such as DATA, USERS, PCs,
    # CLIENTS, WORKSTATIONS, ENDPOINTS, DATA510, CLIENT_620 and USER-300.
    data_vlan_name_regex: '(?i)(?:^|[_\-])(data|users?|pcs?|clients?|workstations?|endpoints?)(?:$|[_\-0-9])'

    # Optional per-job/per-stack override ONLY if Data VLAN names are unclear.
    # Example: approved_data_vlans: [510, 612]. Overrides name matching.
    approved_data_vlans: []

    # Protect common infrastructure by description, in addition to validating
    # switchport mode, shutdown, channel-group, and explicit exclusions.
    protected_description_regex: '(uplink|trunk|firewall|router|core|distribution|do.not.touch)'

    # Unrelated interface changes from Nabil's template are disabled by default.
    overwrite_description: false
    disable_link_logging: false
    disable_snmp_link_traps: false
    disable_auto_mdix: false

    # Optional external export AFTER configuration validation, BEFORE save.
    # Leave blank unless an authorized internal TFTP server is available.
    tftp_server: ''

    dot1x_lines:
      - switchport mode access
      - switchport nonegotiate
      - authentication control-direction in
      - authentication event fail action next-method
      - authentication host-mode multi-auth
      - authentication order dot1x mab
      - authentication priority dot1x mab
      - authentication port-control auto
      - authentication periodic
      - authentication timer reauthenticate server
      - authentication timer inactivity 30
      - mab
      - dot1x pae authenticator
      - dot1x timeout tx-period 8
      - dot1x max-reauth-req 3
      - dot1x max-start 5

  tasks:
    - name: "00 | START | Check job options (DISCOVER or DEPLOY)"
      ansible.builtin.assert:
        that:
          - run_mode in ['discover', 'deploy']
          - deploy_scope in ['approved_only', 'all_discovered']
          - max_ports_per_run | int >= 1
        fail_msg: 'Invalid job options. Default discovery is read-only.'

    - name: Retrieve configured VLAN inventory (read-only)
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_table
      changed_when: false

    - name: Parse all active VLAN IDs and VLAN names (no numeric range)
      ansible.builtin.set_fact:
        active_vlan_records: >-
          {{ vlan_table.stdout[0]
             | regex_findall('(?m)^\s*(\d{1,4})\s+(\S+)\s+active\b') }}
        vlan_name_map: {}
        vlan_port_map: {}
        eligible_targets: []

    - name: Build VLAN inventory map using live Cisco output
      ansible.builtin.set_fact:
        vlan_name_map: '{{ vlan_name_map | combine({ (item[0] | string): item[1] }) }}'
      loop: '{{ active_vlan_records }}'
      loop_control:
        label: 'VLAN {{ item[0] }} ({{ item[1] }})'

    - name: Find named Data VLANs from live VLAN inventory
      ansible.builtin.set_fact:
        active_vlan_ids: '{{ vlan_name_map.keys() | list | sort }}'
        named_data_vlans: >-
          {{ vlan_name_map | dict2items(key_name='vid', value_name='vname')
             | selectattr('vname', 'search', data_vlan_name_regex)
             | map(attribute='vid') | list | sort }}

    - name: Determine safe Data VLAN scope without any numeric range
      ansible.builtin.set_fact:
        data_vlans: >-
          {{ ((approved_data_vlans | map('string') | list)
               if approved_data_vlans | length > 0
               else named_data_vlans)
             | intersect(active_vlan_ids)
             | difference(['1', '1002', '1003', '1004', '1005'])
             | unique | sort | list }}

    - name: Stop deployment if manually approved Data VLANs are absent or inactive
      ansible.builtin.assert:
        that:
          - >-
            (approved_data_vlans | map('string') | list
             | difference(active_vlan_ids) | length) == 0
        fail_msg: >-
          An explicitly approved Data VLAN is absent or inactive on this stack.
          Check show vlan brief; no changes were made.
      when: run_mode == 'deploy'

    - name: Stop deployment when no business Data VLAN can be identified
      ansible.builtin.assert:
        that:
          - data_vlans | length > 0
        fail_msg: >-
          No Data VLAN name matched data_vlan_name_regex. Discovery is safe,
          but deployment is blocked. Review the VLAN names in the discovery
          table, adjust the name pattern, or set approved_data_vlans for this
          switch. Never deploy 802.1X to every VLAN indiscriminately.
      when: run_mode == 'deploy'

    - name: List access members for each discovered VLAN (read-only)
      cisco.ios.ios_command:
        commands:
          - 'show vlan id {{ item }}'
      loop: '{{ data_vlans }}'
      loop_control:
        label: 'VLAN {{ item }}'
      register: vlan_members
      changed_when: false

    - name: Parse member interfaces separately for each Data VLAN
      ansible.builtin.set_fact:
        vlan_port_map: >-
          {{ vlan_port_map | combine({ (item.item | string):
            (item.stdout[0].split('VLAN Type')[0]
             | regex_findall('(?<![A-Za-z0-9])(?:GigabitEthernet|FiveGigabitEthernet|TenGigabitEthernet|TwoGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE|Gi|Fi|Te|Twe|Tw|Fo|Hu)[0-9]+/[0-9]+/[0-9]+(?![A-Za-z0-9/])')
             | unique | sort | list) }) }}
      loop: '{{ vlan_members.results }}'
      loop_control:
        label: 'VLAN {{ item.item }}'

    - name: Combine VLAN member interfaces (no blind interface range)
      ansible.builtin.set_fact:
        vlan_candidates: '{{ vlan_port_map.values() | list | flatten | unique | sort | list }}'

    - name: Confirm switchport mode, VLAN, and running-config for candidates
      cisco.ios.ios_command:
        commands:
          - 'show interfaces {{ item }} switchport'
          - 'show running-config interface {{ item }}'
      loop: '{{ vlan_candidates }}'
      loop_control:
        label: '{{ item }}'
      register: inspected_ports
      changed_when: false

    - name: Select safe ACCESS ports on verified discovered Data VLANs
      ansible.builtin.set_fact:
        eligible_targets: >-
          {{ eligible_targets + [
               {'interface': item.item,
                'vlan': (item.stdout[0]
                  | regex_findall('(?im)^\s*Access Mode VLAN:\s*(\d{1,4})\b')
                  | first),
                'parent': ('interface ' ~ ((item.stdout[1]
                  | regex_findall('(?im)^\s*interface\s+(\S+)')
                  | first) | default(item.item))) }
             ] }}
      loop: '{{ inspected_ports.results }}'
      loop_control:
        label: '{{ item.item }}'
      when:
        - item.stdout | length == 2
        - item.stdout[0] is search('(?im)^\s*Switchport:\s*Enabled\s*$')
        - item.stdout[0] is search('(?im)^\s*Administrative Mode:\s*static access\s*$')
        - >-
          (item.stdout[0] | regex_findall('(?im)^\s*Access Mode VLAN:\s*(\d{1,4})\b')
           | first | default('')) in data_vlans
        - >-
          item.item in (vlan_port_map[
            (item.stdout[0] | regex_findall('(?im)^\s*Access Mode VLAN:\s*(\d{1,4})\b')
             | first | default(''))] | default([]))
        - item.stdout[1] is not search('(?im)^\s*shutdown\s*$')
        - item.stdout[1] is not search('(?im)^\s*channel-group\s+\d+')
        - item.stdout[1] is not search('(?im)^\s*service-policy type control subscriber\b')
        - item.stdout[1] is not search('(?im)^\s*source template\s+')
        - item.stdout[1] is not search('(?im)^\s*description\s+.*' ~ protected_description_regex)
        - item.item not in excluded_interfaces
        - >-
          (allow_voice_vlan_ports | bool)
          or (item.stdout[0] is search('(?im)^\s*Voice VLAN:\s*(?:none|0)(?:\s|$)'))

    # Rendering the dashboard as an array of lines makes each table row visible
    # in AAP's JSON-style stdout callback without requiring ANSI or plugins.
    - name: "01 | DISCOVERY | Build the readable VLAN and port report"
      ansible.builtin.set_fact:
        discovery_dashboard: |-
          ================================================================================
           01 / DISCOVERY     CISCO CATALYST 9300 - DYNAMIC DATA VLAN / 802.1X + MAB
          ================================================================================
           DEVICE     : {{ inventory_hostname }}
           JOB MODE   : {{ run_mode | upper }}
           ACTIVE VLANs : {{ active_vlan_ids | length }} on device (no min/max)
           DATA VLANs   : {{ data_vlans | length }} classified (name or explicit allowlist)
           CANDIDATES   : {{ vlan_candidates | length }} port(s); eligible: {{ eligible_targets | length }}
          --------------------------------------------------------------------------------
           VLAN       VLAN NAME                  MATCH       MEMBERS    ELIGIBLE
          --------------------------------------------------------------------------------
          {% for vid in active_vlan_ids -%}
          {{ " %-10s %-26s %-11s %-10d %-8d" | format(vid, (vlan_name_map[vid] | truncate(25, True)), ('[DATA]' if vid in data_vlans else '[SKIP]'), (vlan_port_map[vid] | default([]) | length), (eligible_targets | selectattr('vlan', 'equalto', vid) | list | length)) }}
          {% endfor -%}
          --------------------------------------------------------------------------------
           INTERFACE                        VLAN     DECISION
          --------------------------------------------------------------------------------
          {% set eligible_names = eligible_targets | map(attribute='interface') | list -%}
          {% for vid in data_vlans -%}
          {% for iface in vlan_port_map[vid] -%}
          {{ " %-32s %-8s %s" | format(iface, vid, '[PASS] ELIGIBLE' if iface in eligible_names else '[SKIP] FILTERED') }}
          {% endfor -%}
          {% endfor -%}
          --------------------------------------------------------------------------------
           POLICY     : Trunk/uplink, shutdown, EtherChannel, and other excluded
                        interfaces are never selected by this discovery stage.
           CLASSIFY   : Names are matched automatically; approved_data_vlans
                        overrides the naming rule when supplied.
           ATTENTION  : If Data VLANs have opaque names, supply approved_data_vlans;
                        VLAN membership alone cannot establish business classification.
           NEXT       : {{ '02 / DEPLOYMENT - controlled change phase' if run_mode == 'deploy' else 'Discovery completed: no configuration was modified' }}
          ================================================================================

    - name: "01 | DISCOVERY | Display professional table in AAP output"
      ansible.builtin.debug:
        msg: "{{ discovery_dashboard.splitlines() }}"

    - name: Prepare explicit deployment selection (no changes)
      ansible.builtin.set_fact:
        selected_targets: >-
          {{ eligible_targets if deploy_scope == 'all_discovered'
             else (eligible_targets | selectattr('interface', 'in', approved_interfaces) | list) }}
      when: run_mode == 'deploy'

    - name: Block deployments without explicit approval and port limits
      ansible.builtin.assert:
        that:
          - deployment_approved | bool
          - selected_targets | length > 0
          - selected_targets | length <= max_ports_per_run | int
          - >-
            deploy_scope == 'all_discovered' or
            (approved_interfaces | difference(eligible_targets | map(attribute='interface') | list) | length == 0)
          - (selected_targets | map(attribute='interface') | unique | list | length) == (selected_targets | length)
        fail_msg: >-
          Deployment blocked. Set deployment_approved=true, use port names from
          discovery for approved_interfaces, and enforce max_ports_per_run.
          To deploy all eligible ports, explicitly set deploy_scope=all_discovered
          AND choose an appropriate max_ports_per_run.
      when: run_mode == 'deploy'

    - name: Check global AAA/802.1X prerequisites before changing any port
      cisco.ios.ios_command:
        commands:
          - 'show running-config | include ^aaa new-model|^aaa authentication dot1x|^dot1x system-auth-control'
      register: aaa_output
      changed_when: false
      when: run_mode == 'deploy'

    - name: Stop if global AAA/802.1X prerequisites are missing
      ansible.builtin.assert:
        that:
          - aaa_output.stdout[0] is search('(?m)^aaa new-model\s*$')
          - aaa_output.stdout[0] is search('(?m)^aaa authentication dot1x\s+\S+')
          - aaa_output.stdout[0] is search('(?m)^dot1x system-auth-control\s*$')
        fail_msg: >-
          Missing global dot1x AAA prerequisites (or unexpected CLI format).
          Nothing was changed. Confirm Cisco ISE/RADIUS availability and global
          configuration before modifying client-facing interfaces.
      when: run_mode == 'deploy'

    - name: Prepare flash checkpoint filename (unique per run)
      ansible.builtin.set_fact:
        checkpoint_filename: >-
          {{ 'ansible-dot1x-' ~
             (inventory_hostname | regex_replace('[^A-Za-z0-9_-]', '_')) ~
             '-' ~ now(utc=true, fmt='%Y%m%dT%H%M%SZ') ~ '.cfg' }}
      when: run_mode == 'deploy'

    - name: "02 | DEPLOYMENT | Build the pre-change approval report"
      ansible.builtin.set_fact:
        deploy_dashboard: |-
          ================================================================================
           02 / DEPLOYMENT    CHANGE PLAN - REVIEW BEFORE APPLYING
          ================================================================================
           DEVICE         : {{ inventory_hostname }}
           APPROVED       : {{ 'YES' if deployment_approved | bool else 'NO' }}
           DEPLOY SCOPE   : {{ deploy_scope }}
           PORT LIMIT     : {{ max_ports_per_run }}
           SELECTED PORTS : {{ selected_targets | length }}
           PRE-CHANGE FILE: flash:{{ checkpoint_filename }}
          --------------------------------------------------------------------------------
           INTERFACE                        DATA VLAN    ACTION
          --------------------------------------------------------------------------------
          {% for target in selected_targets -%}
          {{ " %-32s %-12s %s" | format(target.interface, target.vlan, 'APPLY 802.1X/MAB') }}
          {% endfor -%}
          --------------------------------------------------------------------------------
           SETTINGS: Preserve descriptions={{ not (overwrite_description | bool) }},
                     voice VLAN ports={{ allow_voice_vlan_ports | bool }},
                     session verification={{ require_authorized_session | bool }}
           SEQUENCE: Flash backup -> Configure -> Verify -> Optional TFTP -> Save
           SAFETY  : SSH-based rollback is best effort; link loss may prevent it.
          ================================================================================
      when: run_mode == 'deploy'

    - name: "02 | DEPLOYMENT | Display approved interface table"
      ansible.builtin.debug:
        msg: "{{ deploy_dashboard.splitlines() }}"
      when: run_mode == 'deploy'

    - name: Back up original running-config to Cisco flash BEFORE deployment
      cisco.ios.ios_command:
        commands:
          - command: 'copy running-config flash:{{ checkpoint_filename }}'
            prompt: 'Destination filename.*\?|\[confirm\]'
            answer: "\r"
      register: checkpoint_result
      changed_when: true
      when: run_mode == 'deploy'

    - name: Verify flash checkpoint really exists
      cisco.ios.ios_command:
        commands:
          - 'dir flash:{{ checkpoint_filename }}'
      register: checkpoint_listing
      changed_when: false
      when: run_mode == 'deploy'

    - name: Stop before configuration if backup is absent
      ansible.builtin.assert:
        that:
          - checkpoint_filename in checkpoint_listing.stdout[0]
          - checkpoint_listing.stdout[0] is not search('(?i)%Error|No such file|not found')
        fail_msg: >-
          Pre-change checkpoint could not be verified on the switch flash.
          Nothing was changed. Check flash space and copy command output.
      when: run_mode == 'deploy'

    - name: Deploy, validate, export, and save; attempt SSH rollback on failure
      when: run_mode == 'deploy'
      block:
        - name: Apply Nabil's 802.1X/MAB template to each verified port
          cisco.ios.ios_config:
            parents:
              - '{{ item.parent }}'
            lines: >-
              {{
                (['description Data'] if overwrite_description | bool else [])
                + ['switchport access vlan ' ~ (item.vlan | string)]
                + dot1x_lines
                + (['no logging event link-status'] if disable_link_logging | bool else [])
                + (['no snmp trap link-status'] if disable_snmp_link_traps | bool else [])
                + (['no mdix auto'] if disable_auto_mdix | bool else [])
              }}
            match: line
            save_when: never
          loop: '{{ selected_targets }}'
          loop_control:
            label: '{{ item.interface }} (VLAN {{ item.vlan }})'
          register: deployment_result

        - name: Fetch post-deployment running configuration on affected ports
          cisco.ios.ios_command:
            commands:
              - 'show running-config interface {{ item.interface }}'
          loop: '{{ selected_targets }}'
          loop_control:
            label: '{{ item.interface }}'
          register: post_configs
          changed_when: false

        - name: Verify ALL required lines and correct VLAN per interface
          ansible.builtin.assert:
            that:
              - >-
                ((['switchport access vlan ' ~ (item.item.vlan | string)]
                  + dot1x_lines)
                 | difference(item.stdout[0].splitlines() | map('trim') | list)
                 | length) == 0
            fail_msg: >-
              802.1X template verification failed on {{ item.item.interface }}.
              Rolling back the stack running-config from the flash checkpoint.
          loop: '{{ post_configs.results }}'
          loop_control:
            label: '{{ item.item.interface }}'

        - name: "02 | DEPLOYMENT | Build configuration-verification table"
          ansible.builtin.set_fact:
            verification_dashboard: |-
              --------------------------------------------------------------------------------
               02 / DEPLOYMENT    CONFIGURATION VERIFICATION - ALL SELECTED PORTS
              --------------------------------------------------------------------------------
               INTERFACE                        DATA VLAN     RESULT
              --------------------------------------------------------------------------------
              {% for result in post_configs.results -%}
              {{ " %-32s %-13s %s" | format(result.item.interface, result.item.vlan, '[PASS] REQUIRED LINES PRESENT') }}
              {% endfor -%}
              --------------------------------------------------------------------------------
               NOTE: Configuration present does not prove client authentication.
              --------------------------------------------------------------------------------

        - name: "02 | DEPLOYMENT | Display configuration-verification table"
          ansible.builtin.debug:
            msg: "{{ verification_dashboard.splitlines() }}"

        - name: Optionally collect live authentication sessions for pilot
          cisco.ios.ios_command:
            commands:
              - 'show access-session interface {{ item.interface }} details'
          loop: '{{ selected_targets }}'
          loop_control:
            label: '{{ item.interface }}'
          register: authentication_sessions
          changed_when: false
          when: require_authorized_session | bool

        - name: Fail and roll back when a required pilot session is unauthorized
          ansible.builtin.assert:
            that:
              - item.stdout[0] is search('(?im)^\s*Status:\s*Authorized\b')
            fail_msg: 'No authorized client verified on {{ item.item.interface }}.'
          loop: '{{ authentication_sessions.results | default([]) }}'
          loop_control:
            label: '{{ item.item.interface }}'
          when: require_authorized_session | bool

        - name: Optionally export verified running-config to authorized TFTP server
          cisco.ios.ios_command:
            commands:
              - command: 'copy running-config tftp://{{ tftp_server }}/{{ inventory_hostname }}-dot1x-{{ checkpoint_filename }}'
                prompt: 'Destination filename.*\?|\[confirm\]'
                answer: "\r"
          register: tftp_result
          changed_when: true
          when: tftp_server | length > 0

        - name: Require successful optional TFTP export
          ansible.builtin.assert:
            that:
              - tftp_result.stdout[0] is search('(?i)bytes copied|\[OK\]')
            fail_msg: 'TFTP transfer was not confirmed; rolling back.'
          when: tftp_server | length > 0

        - name: Save running-config to startup-config ONLY after all checks pass
          cisco.ios.ios_config:
            save_when: modified

      rescue:
        - name: Attempt running-config restore from flash (SSH required)
          cisco.ios.ios_command:
            commands:
              - 'configure replace flash:{{ checkpoint_filename }} force'
          register: rollback_attempt
          ignore_errors: true

        - name: "02 | ROLLBACK | Display urgent recovery report"
          ansible.builtin.debug:
            msg:
              - '================================================================================'
              - ' 02 / DEPLOYMENT    [FAIL] - ROLLBACK WAS ATTEMPTED'
              - '--------------------------------------------------------------------------------'
              - ' DEVICE     : {{ inventory_hostname }}'
              - ' CHECKPOINT : flash:{{ checkpoint_filename }}'
              - " COMMAND    : configure replace flash:{{ checkpoint_filename }} force"
              - " REPORTED   : {{ '[PASS] Rollback Done (must verify)' if (rollback_attempt.stdout | default([]) | join('\n')) is search('(?i)Rollback Done') else '[WARN] Rollback not confirmed' }}"
              - ' ACTION     : Verify device, client sessions, and SSH/out-of-band access.'
              - ' STARTUP    : Not intentionally saved by this playbook after failure.'
              - '================================================================================'
              - ' Raw Cisco response:'
              - '{{ rollback_attempt.stdout | default([]) | join(" | ") }}'

        - name: Mark the deployment as failed, never as successful after rescue
          ansible.builtin.fail:
            msg: >-
              Deployment or validation failed on {{ inventory_hostname }}.
              Attempted flash rollback: {{ checkpoint_filename }}. Inspect
              configuration, actual access-session state, and client reachability
              before any retry. Startup-config was not saved by this playbook.

    - name: "03 | FINAL REPORT | Display switch execution summary"
      ansible.builtin.debug:
        msg:
          - '================================================================================'
          - ' EXECUTION SUMMARY    CISCO C9300 / 802.1X-MAB'
          - '--------------------------------------------------------------------------------'
          - ' DEVICE             : {{ inventory_hostname }}'
          - ' MODE               : {{ run_mode | upper }}'
          - ' DATA VLAN IDs      : {{ data_vlans | join(", ") if data_vlans | length else "None classified" }}'
          - ' ELIGIBLE PORTS     : {{ eligible_targets | length }}'
          - " TARGETED PORTS     : {{ selected_targets | default([]) | length if run_mode == 'deploy' else 0 }}"
          - " DISCOVERY          : [PASS] Complete"
          - " DEPLOYMENT         : {{ '[PASS] Configuration commands verified' if run_mode == 'deploy' else '[SKIP] Not requested - read-only run' }}"
          - " AUTH SESSION CHECK : {{ '[PASS] Authorized status observed on inspected sessions' if run_mode == 'deploy' and require_authorized_session | bool else '[INFO] Not requested / not established' }}"
          - " BACKUP             : {{ '[PASS] Flash checkpoint verified' if run_mode == 'deploy' else '[SKIP] No backup needed' }}"
          - " TFTP EXPORT        : {{ '[PASS] Transfer output verified' if run_mode == 'deploy' and tftp_server | length > 0 else '[SKIP] Not configured' }}"
          - " STARTUP SAVE       : {{ '[PASS] Save task completed (save_when=modified)' if run_mode == 'deploy' else '[SKIP] Configuration unchanged' }}"
          - " OVERALL            : {{ '[PASS] Deployment job completed' if run_mode == 'deploy' else '[PASS] Discovery job completed' }}"
          - '--------------------------------------------------------------------------------'
          - ' NOTE: Confirm end-user authentication before expanding deployment scope.'
          - '================================================================================'
